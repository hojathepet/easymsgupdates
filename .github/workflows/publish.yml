name: Validate EasyMsg update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "latest.json"
      - "EasyMsgSetup.exe"
      - "EasyMsg-Windows-x64.zip"
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "latest.json"
      - "EasyMsgSetup.exe"
      - "EasyMsg-Windows-x64.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published files and manifest
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import re
          import zipfile

          manifest = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid version: {version!r}')

          windows = manifest['windows']
          base = 'https://raw.githubusercontent.com/hojathepet/easymsgupdates/main/'
          files = (
              ('EasyMsgSetup.exe', 'installerUrl', 'installerSha256'),
              ('EasyMsg-Windows-x64.zip', 'url', 'sha256'),
          )
          for name, url_key, hash_key in files:
              path = Path(name)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty release file: {name}')
              if windows[url_key] != base + name:
                  raise SystemExit(f'Incorrect {url_key} in latest.json')
              actual = sha256(path.read_bytes()).hexdigest()
              if actual.lower() != str(windows[hash_key]).lower():
                  raise SystemExit(f'SHA-256 mismatch: {name}')
              print(f'{name}: SHA-256 OK')

          if Path('EasyMsgSetup.exe').read_bytes()[:2] != b'MZ':
              raise SystemExit('Installer is not a Windows executable')
          with zipfile.ZipFile('EasyMsg-Windows-x64.zip') as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Windows ZIP contains a corrupt file')
              if not any(name.lower().endswith('easymsg.exe') for name in archive.namelist()):
                  raise SystemExit('Windows ZIP does not contain easymsg.exe')
          print(f'EasyMsg {version} update manifest is valid')
          PY
