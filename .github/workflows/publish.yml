name: Publish EasyMsg update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download final v0.3.1 Windows artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-d61c-822f-bcae-ee078035f176/raw?se=2026-09-24T05%3A25%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=c5c0d336-aca7-5de3-b321-e0699b5e4e8e&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T04%3A05%3A20Z&ske=2026-09-25T04%3A05%3A20Z&sks=b&skv=2026-02-06&sig=byoJ5fivff79cflIXuBTK7/HhRa36CIXxsB7PaTGGy8%3D' -o ci-artifact.zip

      - name: Extract distributable package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile("ci-artifact.zip") as z:
              z.extractall("ci")
          src = Path("ci/EasyMsg-Windows-x64.zip")
          if not src.exists():
              raise SystemExit("EasyMsg-Windows-x64.zip not found in CI artifact")
          Path("EasyMsg-Windows-x64.zip").write_bytes(src.read_bytes())
          PY

      - name: Create update manifest
        run: |
          SHA=$(sha256sum EasyMsg-Windows-x64.zip | awk '{print $1}')
          cat > latest.json <<EOF
          {
            "version": "0.3.1",
            "notes": "자동 업데이트 채널 연결 수정. 이후 새 버전은 EasyMsg가 시작 시 자동으로 확인합니다.",
            "windows": {
              "url": "https://raw.githubusercontent.com/hojathepet/easymsgupdates/main/EasyMsg-Windows-x64.zip",
              "sha256": "$SHA"
            }
          }
          EOF

      - name: Publish update files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EasyMsg-Windows-x64.zip latest.json
          git commit -m "release: EasyMsg 0.3.1" || exit 0
          git push
